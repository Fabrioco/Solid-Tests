services:
  db: 
    image: postgres:16-alpine
    container_name: solid-checkout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: solid
      POSTGRES_PASSWORD: solid
      POSTGRES_DB: solid_checkout
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: